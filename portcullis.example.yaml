# portcullis serve --config portcullis.example.yaml
#
# Each server runs in a locked-down Docker container (see sandbox/run.sh):
# no host files, no network. Build the images first with `make sandbox`.
servers:
  fs:
    command: [sandbox/run.sh, filesystem]
  git:
    command: [sandbox/run.sh, git]
  everything:
    command: [sandbox/run.sh, everything]

audit:
  path: portcullis.db       # relative to this file; created with mode 0600
  max_payload: 65536        # bytes of each message's params and result to keep

# Tool pinning: each tool's definition is recorded the first time it's
# seen. If a server later changes a tool (a "rug pull"), the tool is held
# back until you review and approve it with `portcullis pin diff` and
# `portcullis pin approve`.
pins:
  path: portcullis.pins.json   # relative to this file; worth committing
  new_tools: pin               # pin: trust on first use; hold: approve each new tool too

# The tool-poisoning scanner reads every tool's description and schema
# for text aimed at the model: hidden instructions, mentions of SSH keys
# or .env files, invisible Unicode. A tool with a high-severity finding
# is hidden (hide), or only reported (log); off skips scanning.
scan:
  tools: hide
  ignore: []                   # tool patterns you've reviewed and trust

# Secrets in tool results, resources and prompts (API keys, tokens,
# private keys, passwords in URLs) are replaced with [REDACTED:kind]
# before the model, or the audit log, sees them.
redact:
  patterns: []                 # extra formats: {name: internal_token, regex: 'itk_[a-z0-9]{32}'}

# Prompt-injection checks on tool results and resources: text that tries
# to give the AI instructions ("ignore previous instructions and ...").
# Patterns run on everything; the guard model, a small local model through
# Ollama, judges what they miss. If Ollama is down or slow, the patterns
# carry on alone. warn puts a warning before the result, block withholds
# it, log only records it.
inject:
  action: warn
  guard:
    enabled: true
    model: gemma3:4b          # `ollama pull gemma3:4b`; see the README for other models
    check: all                # all results, or only ones a pattern noticed (suspicious)
    timeout: 15s

# The policy decides which tool calls go ahead. Rules are checked in order
# and the first one that matches decides; a call no rule decides gets the
# default. Blocked calls get a JSON-RPC error naming the rule, and every
# decision goes into the audit log (`portcullis audit --blocked`).
policy:
  default: allow
  rules:
    # A rate limit doesn't decide unless it's exceeded, so put it first to
    # count every call.
    - name: call-budget
      tool: "*"
      rate_limit: 120/min

    # The container only has /workspace, but say so here too, and catch
    # tricks like /workspace/../etc. values() collects every path argument,
    # including move_file's source and destination.
    - name: fs-workspace-only
      tool: "fs__*"
      when: 'values(args, ["path", "paths", "source", "destination"]).exists(p, !under(p, "/workspace"))'
      action: deny
      reason: the filesystem tools only work under /workspace

    - name: no-history-rewrites
      tool: [git__git_reset, git__git_checkout]
      action: deny

    # Waits for a person to approve. Until the approval flow exists, this
    # blocks the call.
    - name: confirm-commits
      tool: git__git_commit
      action: require_approval

    # A demo server's tool that dumps the environment.
    - name: no-env-dumps
      tool: everything__get-env
      action: deny
      reason: environment variables can hold secrets

    # log_only: recorded as what it would have done, but not enforced.
    # Try a rule this way before turning it on.
    - name: trial-no-writes
      tool: [fs__write_file, fs__edit_file, fs__move_file]
      action: deny
      log_only: true
