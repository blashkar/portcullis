name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code, so the GITHUB_TOKEN can't write anything.
permissions:
  contents: read

# Actions are pinned to full commit SHAs, since a tag can be moved to other
# code; the comment says which release it is. Dependabot keeps them current.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: make vuln

  # A short fuzzing pass over the parsers and checks that take input from
  # clients and servers. A failure prints the input that caused it.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=20s
      - name: Show the failing input
        if: failure()
        run: find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;

  # Builds the sandboxed MCP servers, the demo's malicious one included, and
  # checks from inside each container that it can't reach the host.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make sandbox
      - run: for s in filesystem git everything evil; do sandbox/check.sh "$s" || exit 1; done
