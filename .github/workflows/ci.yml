name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code, so the GITHUB_TOKEN can't write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: make vuln

  # Builds the sandboxed MCP servers, the demo's malicious one included, and
  # checks from inside each container that it can't reach the host.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make sandbox
      - run: for s in filesystem git everything evil; do sandbox/check.sh "$s" || exit 1; done
