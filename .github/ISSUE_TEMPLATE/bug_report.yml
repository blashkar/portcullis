name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The portcullis command, the MCP server it wraps, and the client you used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Logs
      description: The portcullis log for the session. Remove anything private first.
      render: text
  - type: input
    id: version
    attributes:
      label: portcullis version
      description: Output of `portcullis --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and MCP client
      placeholder: macOS 15, Claude Code 2.1
